<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hoomi micro-app example</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #16181d; }
      main { max-width: 480px; margin: 0 auto; padding: 16px; display: grid; gap: 12px; }
      section { background: #fff; border: 1px solid #e3e6ea; border-radius: 10px; padding: 14px; }
      h1 { font-size: 18px; margin: 8px 0 0; }
      h2 { font-size: 14px; margin: 0 0 8px; color: #444a55; }
      button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid #c8cdd4; background: #fff; cursor: pointer; margin-right: 6px; }
      button.primary { background: #14532d; border-color: #14532d; color: #fff; }
      .err { color: #b3261e; font-size: 13px; }
      .ok { color: #14532d; font-size: 13px; }
      code { background: #eef1f4; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
